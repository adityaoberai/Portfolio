<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Newsreader';
				src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2')
					format('woff2');
				font-weight: 200 800;
				font-style: normal;
			}
			@font-face {
				font-family: 'Newsreader';
				src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-italic.woff2')
					format('woff2');
				font-weight: 200 800;
				font-style: italic;
			}
			/* V3 palette, shared with the site and the room. */
			:root {
				--paper: #f8f5ed;
				--room: #e9ebdf;
				--ink: #1f2620;
				--ink-soft: #3a473d;
				--secondary: #5f6555;
				--hairline: #dedbcf;
				--accent: #304e42;
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				display: grid;
				grid-template-columns: 470px 1fr;
				gap: 36px;
				padding: 52px 52px 52px 64px;
				background: var(--paper);
				color: var(--ink);
				font-family: 'Newsreader', Georgia, serif;
				font-optical-sizing: auto;
				-webkit-font-smoothing: antialiased;
			}
			.text {
				display: flex;
				flex-direction: column;
			}
			.site {
				font-size: 24px;
				font-style: italic;
				font-weight: 500;
			}
			.mono {
				font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
				font-size: 15px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--secondary);
			}
			.role {
				margin-top: 10px;
			}
			h1 {
				margin-top: auto;
				font-size: 68px;
				line-height: 1.04;
				font-weight: 500;
				letter-spacing: -0.035em;
			}
			.lede {
				margin-top: 22px;
				font-size: 25px;
				line-height: 1.4;
				color: var(--ink-soft);
			}
			.modes {
				display: flex;
				gap: 6px;
				margin-top: auto;
				padding: 5px;
				width: max-content;
				border: 1px solid #c9c4b6;
				border-radius: 999px;
				font:
					600 14px/1 system-ui,
					sans-serif;
				letter-spacing: 0.08em;
			}
			.modes span {
				padding: 12px 20px;
				border-radius: 999px;
				color: #55574d;
			}
			.modes .on {
				background: var(--accent);
				color: #fffdf6;
			}
			.frame {
				overflow: hidden;
				border: 1px solid #d3d5c3;
				border-radius: 12px;
				background: var(--room);
			}
			.frame img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: 50% 55%;
			}
		</style>
	</head>
	<body>
		<div class="text">
			<div class="site">adityaoberai.com</div>
			<div class="mono role">Aditya Oberai · Developer Relations at Appwrite</div>
			<h1>Come spend a minute in my world.</h1>
			<p class="lede">Walk around my room, or skim the Index.</p>
			<div class="modes"><span class="on">WORLD</span><span>INDEX</span></div>
		</div>
		<div class="frame"><img src="room.jpg" alt="" /></div>
	</body>
</html>
