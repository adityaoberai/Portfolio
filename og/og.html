<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Aditya Oberai's world</title>
		<style>
			@font-face {
				font-family: 'Newsreader';
				src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2')
					format('woff2');
				font-weight: 200 800;
				font-style: normal;
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				position: relative;
				background: #e9ebdf;
				color: #1f2620;
				font-family: 'Newsreader', Georgia, serif;
				font-optical-sizing: auto;
				-webkit-font-smoothing: antialiased;
			}
			.text {
				position: absolute;
				z-index: 1;
				top: 198px;
				left: 64px;
				width: 440px;
			}
			h1 {
				font-size: 62px;
				line-height: 1.1;
				font-weight: 500;
				letter-spacing: -0.025em;
				white-space: nowrap;
			}
			.invitation {
				margin-top: 28px;
				color: #3a473d;
				font-size: 36px;
				line-height: 1.18;
			}
			.domain {
				position: absolute;
				left: 64px;
				bottom: 46px;
				color: #304e42;
				font-size: 21px;
				line-height: 1.2;
			}
			.room {
				position: absolute;
				top: 19px;
				left: 355px;
				width: 920px;
				height: auto;
			}
		</style>
	</head>
	<body>
		<img class="room" src="room.jpg" width="2880" height="2000" alt="Aditya's illustrated room" />
		<div class="text">
			<h1>Aditya Oberai</h1>
			<p class="invitation">Come spend a minute<br />in my world.</p>
		</div>
		<p class="domain">adityaoberai.com</p>
	</body>
</html>
